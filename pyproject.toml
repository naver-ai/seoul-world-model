[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seoul-world-model"
dynamic = ["version"]
authors = [
  {name = "NAVER Corp."},
  {name = "NVIDIA Corporation"},
]
description = "Seoul World Model: a city-scale autoregressive world model grounded in Seoul, built on NVIDIA Cosmos-Predict2.5"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "boto3>=1.40.63",
  "cosmos-oss==0.1.0",
]

[project.optional-dependencies]
gradio = ["cosmos-oss[gradio]"]
cu128 = ["cosmos-oss[cu128_torch27]"]
cu130 = ["cosmos-oss[cu130_torch29]"]

[dependency-groups]
dev = ["cosmos-oss[dev,gradio]"]

[project.readme]
content-type = "text/markdown"
text = '''
# Seoul World Model

Grounding World Simulation Models in a Real-World Metropolis.
[Project page](https://seoul-world-model.github.io/) | [Paper](https://arxiv.org/abs/2603.15583)
'''

[project.urls]
homepage = "https://seoul-world-model.github.io/"
repository = "https://github.com/naver-ai/seoul-world-model"
paper = "https://arxiv.org/abs/2603.15583"
upstream = "https://github.com/nvidia-cosmos/cosmos-predict2.5"

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cu129"}, {extra = "cu130"}],
]
override-dependencies = ["numpy>=2.0.0"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cosmos-oss = [{ workspace = true }]

[tool.hatch.version]
path = "cosmos_predict2/__about__.py"

[tool.hatch.build.targets.sdist]
packages = [
  "cosmos_predict2",
]
include = [
  "sitecustomize.py",
]

[tool.hatch.build.targets.wheel]
packages = [
  "cosmos_predict2",
]
include = [
  "sitecustomize.py",
]
exclude = [
  "*_test.py",
]

[tool.coverage.run]
parallel = true
concurrency = ["thread", "multiprocessing"]
source = ["cosmos_predict2"]
sigterm = true

[tool.coverage.paths]
source = [
  "cosmos_predict2/",
  "*/site-packages/cosmos_predict2/",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]
